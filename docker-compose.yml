version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: subscriptions
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d subscriptions"]
      interval: 5s
      timeout: 3s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      APP_DATABASE_DSN: postgres://user:password@postgres:5432/subscriptions?sslmode=disable
      APP_SERVER_ADDR: ":8080"
      APP_LOGGING_LEVEL: "info"
    ports:
      - "8080:8080"

volumes:
  pgdata: {}
